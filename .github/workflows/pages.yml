name: Deploy latest to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install KTX Software 4.4.2
        shell: bash
        run: |
          curl -fL --retry 3 \
            https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.tar.bz2 \
            -o /tmp/ktx.tar.bz2
          mkdir -p /tmp/ktx
          tar -xjf /tmp/ktx.tar.bz2 -C /tmp/ktx
          KTX_BIN="$(find /tmp/ktx -type f -name toktx -perm -111 | head -n 1)"
          test -n "$KTX_BIN"
          KTX_ROOT="$(dirname "$(dirname "$KTX_BIN")")"
          echo "$(dirname "$KTX_BIN")" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$KTX_ROOT/lib:$KTX_ROOT/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          "$KTX_BIN" --version

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build static production demo
        env:
          VITE_PUBLIC_BASE: /paper-bazaar-3d_2/
        run: npm run build

      - name: Verify KTX2 and hero assets
        shell: bash
        run: |
          test -s public/textures/production/market-material-atlas.ktx2
          grep -q '"compressed": true' public/textures/production/runtime-textures.json
          test -s public/models/hero-wholesale-v1.glb
          test -s public/models/hero-packaging-v1.glb
          test -s public/models/hero-paper-studio-v1.glb

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy latest main
        id: deployment
        uses: actions/deploy-pages@v4
