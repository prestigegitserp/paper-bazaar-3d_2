name: Migrate stable v0.15 baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-v015.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone legacy stable v0.15 snapshot read-only
        run: git clone --depth 1 --branch release/v0.15.0 https://github.com/prestigegitserp/paper-bazaar-3d.git /tmp/paper-bazaar-v015

      - name: Import source snapshot
        run: |
          rsync -a --delete --exclude '.git' --exclude 'MIGRATION_ORIGIN.md' --exclude '.github/workflows/***' /tmp/paper-bazaar-v015/ ./
          printf '%s\n' '' 'Migration source:' '- legacy repository: prestigegitserp/paper-bazaar-3d' '- source ref: release/v0.15.0' '- source commit: 2a85822b6d9e05a3c3c15b0a290b46ac077f76bc' '- imported into: prestigegitserp/paper-bazaar-3d_2' '' 'All v0.16+ development happens only in this repository.' >> MIGRATION_ORIGIN.md

      - name: Commit migrated baseline
        run: |
          git config user.name "paper-bazaar-migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Migration already up to date."
            exit 0
          fi
          git commit -m "chore: import stable v0.15 baseline from legacy repository"
          git push origin HEAD:main
